name: ci

on:
- pull_request
- push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
        - Node.js 22.x
        - Node.js 24.x
        - Node.js 26.x

        include:
        - name: Node.js 22.x
          node-version: "22"
        - name: Node.js 24.x
          node-version: "24"
        - name: Node.js 26.x
          node-version: "26"

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Node.js dependencies
      run: npm install

    - name: List environment
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        npm -s ls ||:

    - name: Run tests
      run: npm run test-ci

    - name: Lint code
      run: npm run lint
